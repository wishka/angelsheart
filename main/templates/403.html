{% extends 'base.html' %}

{% block title %}Доступ закрыт | Ангел-Хранитель{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 0 auto; text-align: center;">
    <i class="fas fa-lock" style="font-size: 3rem; color: #d4737a;"></i>
    <h1 style="color: #d4737a; margin: 1rem 0 0.5rem;">Доступ закрыт</h1>
    <p style="color: #6b5a5a;">
        У вас нет прав на эту страницу. Если вы отправляли форму, она могла
        устареть — откройте страницу заново и повторите действие.
    </p>
    <a href="{% url 'main:dashboard' %}" class="btn btn-primary" style="margin-top: 1rem;">
        На главную
    </a>
</div>
{% endblock %}
