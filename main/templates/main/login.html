{% extends 'base.html' %}

{% block title %}Вход | Ангел-Хранитель{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 450px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-angel" style="font-size: 3rem; color: #e8a4aa;"></i>
            <h1 style="color: #d4737a; margin-top: 1rem;">С возвращением!</h1>
            <p style="color: #6b5a5a;">Рады видеть вас снова</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label><i class="fas fa-user"></i> Имя пользователя</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <!-- Чекбокс "Запомнить меня" -->
            <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" name="remember_me" id="remember_me" style="width: 18px; height: 18px;">
                <label for="remember_me" style="margin: 0; cursor: pointer;">
                    <i class="fas fa-check-circle"></i> Запомнить меня
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #6b5a5a;">Нет аккаунта? <a href="{% url 'main:register' %}" style="color: #d4737a; text-decoration: none;">Зарегистрироваться</a></p>
        </div>
    </div>
</div>

<!-- Декоративные горлицы на странице входа -->
<div style="position: fixed; bottom: 20px; left: 20px; opacity: 0.3;">
    <i class="fas fa-dove" style="font-size: 80px;"></i>
</div>
{% endblock %}
