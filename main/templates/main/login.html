{% extends 'base.html' %}

{% block title %}Вход | Ангел-Хранитель{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 450px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-angel" style="font-size: 3rem; color: #e8a4aa;"></i>
            <h1 style="color: #d4737a; margin-top: 1rem;">С возвращением!</h1>
            <p style="color: #6b5a5a;">Рады видеть вас снова</p>
        </div>

        <form method="post" action="{% url 'main:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Имя пользователя</label>
                <input type="text"
                       name="username"
                       id="username"
                       class="form-control"
                       required
                       autofocus
                       autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль</label>
                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       required
                       autocomplete="current-password">
            </div>

            <!-- Чекбокс "Запомнить меня" -->
            <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox"
                       name="remember_me"
                       id="remember_me"
                       style="width: 18px; height: 18px; cursor: pointer;">
                <label for="remember_me" style="margin: 0; cursor: pointer; color: #6b5a5a;">
                    <i class="fas fa-check-circle"></i> Запомнить меня
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #6b5a5a;">Нет аккаунта? <a href="{% url 'main:register' %}" style="color: #d4737a; text-decoration: none;">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
<script>
    // Сохранение имени пользователя для автозаполнения при следующем входе
    document.addEventListener('DOMContentLoaded', function() {
        const savedUsername = localStorage.getItem('saved_username');
        const usernameInput = document.getElementById('username');

        if (savedUsername && usernameInput) {
            usernameInput.value = savedUsername;
        }

        // Обработка "Запомнить меня"
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function() {
                const rememberMe = document.getElementById('remember_me').checked;
                const username = document.getElementById('username').value;

                if (rememberMe) {
                    localStorage.setItem('saved_username', username);
                } else {
                    localStorage.removeItem('saved_username');
                }
            });
        }
    });
</script>
{% endblock %}
