{% extends 'base.html' %}

{% block title %}Пароль изменён | Ангел-Хранитель{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto; text-align: center;">
    <i class="fas fa-circle-check" style="font-size: 3rem; color: #28a745;"></i>
    <h1 style="color: #d4737a; margin: 1rem 0 0.5rem;">Пароль изменён</h1>
    <p style="color: #6b5a5a;">
        Войдите с новым паролем. Если вы включали двухфакторную аутентификацию,
        она по-прежнему потребуется.
    </p>
    <a href="{% url 'main:login' %}" class="btn btn-primary" style="margin-top: 1rem;">
        Войти
    </a>
</div>
{% endblock %}
