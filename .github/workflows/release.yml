# Выпуск Android-приложения по тегу.
#
#   git checkout main && git pull
#   git tag v1.2.0 && git push origin v1.2.0
#
# Тег vX.Y.Z → проверки → (подтверждение в окружении production) →
# подписанные APK и AAB → GitHub Release с файлами и контрольными
# суммами → APK на боевой сервер для скачивания с сайта.
#
# Код версии считается из тега: X*10000 + Y*100 + Z (v1.2.3 → 10203).
# Он обязан расти от выпуска к выпуску — иначе RuStore и Google Play не
# примут сборку, а телефон не поставит её поверх установленной.
# AAB прикладывается к выпуску для будущей публикации в RuStore.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Тег стоит на main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Тег ${GITHUB_REF_NAME} не на ветке main. Выпуск — только из main (docs/CICD.md)"
            exit 1
          fi
      - name: Версия из тега
        id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::Минорная и патч-версия — не больше 99"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  android-release:
    needs: [version, ci]
    runs-on: ubuntu-latest
    # Ключ подписи и доступ к боевому серверу — секреты окружения
    # production: задание ждёт подтверждения, как и выкладка сервера
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи и Firebase
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — подписать выпуск нечем (docs/CICD.md)"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android-kotlin/app/google-services.json
          else
            echo "::warning::Нет GOOGLE_SERVICES_JSON — выпуск без push-уведомлений"
          fi

      - name: Сборка
        working-directory: android-kotlin
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Проверка подписи и файлы выпуска
        run: |
          mkdir -p dist
          cp android-kotlin/app/build/outputs/apk/release/app-release.apk "dist/angelsheart-$VERSION_NAME.apk"
          cp android-kotlin/app/build/outputs/bundle/release/app-release.aab "dist/angelsheart-$VERSION_NAME.aab"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          # Неподписанный или подписанный не тем ключом APK не встанет
          # поверх установленного — лучше узнать это здесь, чем от людей
          "$APKSIGNER" verify --print-certs "dist/angelsheart-$VERSION_NAME.apk" | tee dist/signature.txt
          (cd dist && sha256sum angelsheart-* > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: angelsheart-${{ needs.version.outputs.name }}
          path: dist/

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/angelsheart-$VERSION_NAME.apk" \
            "dist/angelsheart-$VERSION_NAME.aab" \
            dist/SHA256SUMS.txt \
            --title "Ангел-Хранитель $VERSION_NAME" \
            --generate-notes --verify-tag

      - name: APK на сайт
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          APP_DIR: ${{ vars.DEPLOY_PATH || '/srv/angelsheart' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Сервер production не настроен — APK только в GitHub Release"; exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          UPLOAD="$APP_DIR/shared/app-release/upload-$VERSION_NAME.apk"
          rsync -az -e "$SSH" "dist/angelsheart-$VERSION_NAME.apk" "$DEPLOY_USER@$DEPLOY_HOST:$UPLOAD"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' bash '$APP_DIR/current/deploy/publish-apk.sh' '$UPLOAD' '$VERSION_NAME'"
