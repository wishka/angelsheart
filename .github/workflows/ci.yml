# Проверки. Запускаются:
#   • на каждый pull request — их результат обязателен для слияния
#     в develop и main (см. scripts/setup-github.sh);
#   • на push в рабочие ветки (feature/*, fix/* и т. п.);
#   • из deploy.yml и release.yml перед выкладкой (workflow_call) —
#     поэтому на push в develop/main отдельно не запускаются.
#
# Имена заданий («server (sqlite)» и т. д.) — это имена обязательных
# проверок в правилах защиты веток. Переименовали задание — обновите
# правила, иначе слияние будет ждать проверку, которой больше нет.

name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, develop]
    tags-ignore: ['**']
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  server-sqlite:
    name: server (sqlite)
    runs-on: ubuntu-latest
    env:
      # Заглушки секретов допускаются только при DEBUG — для тестов это и нужно
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p logs
      - name: Миграции соответствуют моделям
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test main social angelsheart --noinput

  # Боевая база — PostgreSQL. На ней по-другому работают блокировки
  # строк (select_for_update), сравнение строк и транзакции; тест,
  # прошедший только на SQLite, ничего не говорит о денежных операциях.
  server-postgres:
    name: server (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: angelsheart
          POSTGRES_USER: angelsheart
          POSTGRES_PASSWORD: angelsheart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U angelsheart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      POSTGRES_DB: angelsheart
      POSTGRES_USER: angelsheart
      POSTGRES_PASSWORD: angelsheart
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p logs
      - run: python manage.py test main social angelsheart --noinput

  android:
    name: android (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Android SDK на раннерах GitHub уже установлен (ANDROID_HOME)
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      # Lint пока не блокирует: у существующего кода могут быть замечания,
      # которые никто не разбирал. Отчёт — в артефактах запуска; когда он
      # станет чистым, уберите continue-on-error.
      - name: Android lint
        run: ./gradlew lintDebug
        continue-on-error: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-lint-report
          path: android-kotlin/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: angelsheart-debug-apk
          path: android-kotlin/app/build/outputs/apk/debug/*.apk
